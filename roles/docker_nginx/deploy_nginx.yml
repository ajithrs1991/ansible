---
- name: pull nginx image from docker hub
  docker_image: 
    name: "{{ nginx_image }}"
    source: pull
- name: Deploy nginx docker container
  docker_container:
    name: nginx
    image: "{{ nginx_image }}"
    state: started
    restart_policy: always
    published_ports: 
      - "80:80"
    volumes:
      - "/etc/nginx/nginx.conf:/etc/nginx/nginx.conf"
    env:
      NGINX_HOST: "{{ nginx_server_name }}"
      PROJECT_ROOT: "{{ nginx_root }}"
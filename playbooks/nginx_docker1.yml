---
- name: Deploy NGINX Docker container on web servers
  hosts: "{{ target_environment }}:{{ target_project }}:web"
  become: yes
  vars_files:
    - vars/nginx.yml
  roles:
    - nginx_deploy
  tasks:
    - name: Set environment-specific variables
      set_fact:
        nginx_container_name: "{{ lookup('vars', target_project).nginx_container_name }}"
        nginx_configuration_file: "{{ lookup('vars', target_project).nginx_configuration_file }}"
        nginx_image: "{{ nginx_image }}"

    - name: Set NGINX container name based on project
      debug:
        msg: "Deploying NGINX container {{ nginx_container_name }} on web servers with config {{ nginx_configuration_file }}"

#ansible-playbook deploy_nginx.yml -i inventory.yml -e target_environment=dev -e target_project=project1
#ansible-playbook deploy_nginx.yml -i inventory.yml -e target_environment=dev -e target_project=project1 -e target_group="web,bb"


- name: Deploy NGINX Docker container on selected server groups
  hosts: "{{ target_environment }}:{{ target_project }}:{{ target_group }}"
  become: yes
  vars_files:
    - vars/nginx.yml
  roles:
    - nginx_deploy

- name: Deploy NGINX container on web servers
  docker_container:
    name: "{{ nginx_container_name }}-web"
    image: "{{ nginx_image }}"
    state: started
    ports:
      - "{{ nginx_port }}:80"
    volumes:
      - "{{ nginx_configuration_file }}:/etc/nginx/nginx.conf"
    restart_policy: always
  when: "'web' in group_names"

- name: Deploy NGINX container on bb servers
  docker_container:
    name: "{{ nginx_container_name }}-bb"
    image: "{{ nginx_image }}"
    state: started
    ports:
      - "{{ nginx_port }}:80"
    volumes:
      - "{{ nginx_configuration_file }}:/etc/nginx/nginx.conf"
    restart_policy: always
  when: "'bb' in group_names"


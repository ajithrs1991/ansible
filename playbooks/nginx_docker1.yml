# roles/docker/tasks/main.yml

- name: Install Docker on Ubuntu/Debian
  apt:
    name: "{{ ubuntu_docker_package }}"
    state: present
    update_cache: yes
  when: ansible_facts['distribution'] in ["Ubuntu", "Debian"]

- name: Add Docker repository for Ubuntu/Debian (if using docker.io)
  apt_repository:
    repo: "deb [arch=amd64] {{ ubuntu_docker_repo_url }} {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: "docker"
  when: ansible_facts['distribution'] in ["Ubuntu", "Debian"] and docker_version == "latest"

- name: Install Docker version on Debian (if not using docker.io package)
  apt:
    name: "docker-ce={{ docker_version }}"
    state: present
  when: ansible_facts['distribution'] == "Debian" and docker_version != "latest"

- name: Start and enable Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Add user to Docker group (optional)
  user:
    name: "{{ ansible_user }}"
    group: docker
    append: yes
  when: ansible_facts['distribution'] in ["Ubuntu", "Debian"]

---
# playbooks/deploy_nginx_docker.yml

- name: Deploy NGINX Docker container
  hosts: "{{ target_environment }}:{{ target_project }}:web"  # Target web servers in the environment and project
  become: yes  # Ensure the playbook runs with elevated privileges
  vars:
    docker_version: "latest"  # Can be overridden with a specific version if necessary
    nginx_container_name: "nginx-container"
    nginx_configuration_file: "/tmp/nginx.conf"  # Path to the NGINX configuration (or use Jinja2 template)
    nginx_server_name: "example.com"
  roles:
    - docker  # Use the Docker role to ensure Docker is installed on the host

  tasks:
    - name: Pull the latest NGINX Docker image
      docker_image:
        name: nginx
        source: pull
        tag: latest

    - name: Create and start NGINX container
      docker_container:
        name: "{{ nginx_container_name }}"
        image: nginx:latest
        state: started
        restart_policy: always
        ports:
          - "80:80"  # Expose port 80
        volumes:
          - "{{ nginx_configuration_file }}:/etc/nginx/nginx.conf:ro"  # Mount the NGINX config file
        env:
          NGINX_HOST: "{{ nginx_server_name }}"

    - name: Ensure NGINX container is running
      docker_container:
        name: "{{ nginx_container_name }}"
        state: started
        restart_policy: always


---
# playbooks/deploy_nginx.yml

- name: Deploy NGINX Docker container with dynamic configuration
  hosts: "{{ target_environment }}:{{ target_project }}:web"  # Target web servers in the environment and project
  become: yes  # Use sudo to run tasks that require elevated privileges
  vars_files:
    - ../vars/nginx.yml  # Import global nginx variables

  roles:
    - nginx  # Use the nginx role defined in the 'roles' directory

  tasks:
    - name: Install Docker if not already installed
      apt:
        name: docker.io
        state: present
        update_cache: yes
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Pull the latest NGINX Docker image
      docker_image:
        name: nginx
        source: pull
        tag: latest

    - name: Render NGINX configuration file from template
      template:
        src: roles/nginx/templates/nginx.conf.j2
        dest: "/tmp/nginx.conf"  # Temporary location for NGINX config

    - name: Create and start NGINX container with dynamic config
      docker_container:
        name: "{{ nginx_container_name }}"
        image: nginx:latest
        state: started
        restart_policy: always
        ports:
          - "80:80"  # Expose port 80
          - "443:443"  # Expose port 443 if SSL is enabled
        volumes:
          - "/tmp/nginx.conf:/etc/nginx/nginx.conf:ro"  # Mount the dynamically rendered NGINX config
        env:
          NGINX_HOST: "{{ nginx_server_name }}"

    - name: Ensure NGINX container is running
      docker_container:
        name: "{{ nginx_container_name }}"
        state: started
        restart_policy: always

